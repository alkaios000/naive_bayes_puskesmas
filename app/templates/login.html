<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - {{ app_name }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/scrollbar.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-subtle);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 32px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand .icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background-color: var(--blue-subtle);
      color: var(--blue-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .login-brand h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .login-brand p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .credential-hint {
      margin-top: 20px;
      padding: 12px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="icon">
        <i class="fa-solid fa-hospital-user"></i>
      </div>
      <h1>Puskesmas Sarang 1</h1>
      <p>Sistem Prediksi Tren Kasus Penyakit</p>
    </div>

    <div id="loginAlert" class="alert alert-danger" style="display: none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Nama Pengguna</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Kata Sandi</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Sistem
      </button>
    </form>

    <div class="credential-hint">
      <strong>Akun Akses Default:</strong><br>
      - <b>Admin:</b> <code>admin</code> / <code>admin_puskesmas_sarang1</code><br>
      - <b>Viewer:</b> <code>viewer</code> / <code>viewer_puskesmas_sarang1</code>
    </div>
  </div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const alertBox = document.getElementById("loginAlert");
    alertBox.style.display = "none";
    
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Memeriksa...`;

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error?.message || data.detail?.error?.message || "Login gagal");
      }

      // Simpan token di localStorage sebagai cadangan
      localStorage.setItem("access_token", data.access_token);
      localStorage.setItem("user_role", data.role);
      
      // Redirect ke dashboard
      window.location.href = "/dashboard";
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.style.display = "flex";
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Sistem`;
    }
  });
</script>

</body>
</html>
