services:
  web:
    build: .
    container_name: naive_bayes_puskesmas_app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Prediksi Tren Penyakit Puskesmas Sarang 1
      - DEBUG=False
      - SECRET_KEY=kunci-rahasia-docker-puskesmas-sarang-1
      - DATABASE_URL=sqlite:///./naive_bayes_puskesmas.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin_puskesmas_sarang1
      - VIEWER_USERNAME=viewer
      - VIEWER_PASSWORD=viewer_puskesmas_sarang1
    volumes:
      - ./naive_bayes_puskesmas.db:/app/naive_bayes_puskesmas.db
      - ./models_storage:/app/models_storage
      - ./uploads:/app/uploads
    restart: unless-stopped
